name: Weekly Dataset Scouting

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  scout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install pandas
      - name: Refresh candidate artifacts
        run: python tools/refresh_candidates.py
      - name: Upload scouting artifacts
        uses: actions/upload-artifact@v4
        with:
          name: weekly-scout
          path: data/sources/automation_runs/*
