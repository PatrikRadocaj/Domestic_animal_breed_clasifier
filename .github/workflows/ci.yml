name: CI

on:
  pull_request:
  push:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests tools
      - name: Type Check
        run: mypy src/animal_breed --ignore-missing-imports
      - name: Tests
        run: pytest -q
      - name: Hydra Config Resolve Check
        run: python -m pytest -q tests/test_config_resolve.py
      - name: Data QA Smoke
        run: python tools/data_quality_gate.py --help
      - name: Tiny Training Smoke
        run: python tools/smoke_tiny_training.py
