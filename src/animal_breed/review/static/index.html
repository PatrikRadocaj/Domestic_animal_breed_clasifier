<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Box Review</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="left-panel">
        <div class="panel-header">
          <h1>Box Review</h1>
          <p id="summaryText"></p>
        </div>
        <div class="filters">
          <label>
            Status
            <select id="statusFilter">
              <option value="all">All</option>
              <option value="unreviewed">Unreviewed</option>
              <option value="reviewed">Reviewed</option>
              <option value="flagged">Flagged</option>
            </select>
          </label>
          <label>
            Search
            <input id="searchInput" type="text" placeholder="species, dataset, path" />
          </label>
        </div>
        <div id="recordList" class="record-list"></div>
      </aside>

      <main class="canvas-panel">
        <div class="toolbar">
          <button id="prevBtn" type="button">Prev</button>
          <button id="nextBtn" type="button">Next</button>
          <button id="resetBoxBtn" type="button">Reset Box</button>
          <button id="fitBtn" type="button">Fit</button>
        </div>
        <div class="canvas-wrap">
          <div class="canvas-stage" id="canvasStage">
            <img id="reviewImage" alt="Review candidate" />
            <canvas id="reviewCanvas" width="960" height="640"></canvas>
          </div>
          <div id="canvasMessage" class="canvas-message">Loading image...</div>
        </div>
      </main>

      <aside class="right-panel">
        <div class="panel-header">
          <h2>Candidate</h2>
        </div>
        <div id="metaBlock" class="meta-block"></div>
        <form id="reviewForm" class="review-form">
          <label>
            Review Status
            <select id="reviewStatus">
              <option value="unreviewed">Unreviewed</option>
              <option value="reviewed">Reviewed</option>
              <option value="flagged">Flagged</option>
            </select>
          </label>
          <label>
            Decision
            <select id="reviewDecision">
              <option value="">Unset</option>
              <option value="accept">Accept</option>
              <option value="reject">Reject</option>
              <option value="adjusted">Adjusted</option>
              <option value="unsure">Unsure</option>
            </select>
          </label>
          <label>
            Notes
            <textarea id="reviewNotes" rows="6" placeholder="Why keep, reject, or adjust this box?"></textarea>
          </label>
          <div class="box-grid">
            <label>X Min <input id="boxXMin" type="number" step="0.1" /></label>
            <label>Y Min <input id="boxYMin" type="number" step="0.1" /></label>
            <label>X Max <input id="boxXMax" type="number" step="0.1" /></label>
            <label>Y Max <input id="boxYMax" type="number" step="0.1" /></label>
          </div>
          <button id="saveBtn" type="submit">Save Review</button>
          <p id="saveStatus" class="save-status"></p>
        </form>
      </aside>
    </div>
    <script src="/static/app.js"></script>
  </body>
  </html>
