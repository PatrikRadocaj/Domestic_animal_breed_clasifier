version: cross_dataset_label_map_v2
description: >
  Canonical species/breed normalisation across mixed-source datasets.
  Applied before taxonomy resolution during manifest ingestion.
  v2 changes: added all missing species; added ImageNet dog-breed alias table;
  added pig breed aliases; fixed "undefined → sheep" bug (now null); fixed
  "friesian" collision; removed redundant dataset overrides; added dromedary
  colour-label aliases; corrected encoding artefacts.

normalization:
  noise_tokens:
    - class
    - classes
    - label
    - labels
    - animal
    - animals
    - breed
    - breeds
    - dataset
    - image
    - images

# ─── SPECIES ──────────────────────────────────────────────────────────────────
species:
  - canonical_id: dog
    aliases: [dog, dogs, canine, canis_familiaris, domestic_dog]
  - canonical_id: cat
    aliases: [cat, cats, feline, domestic_cat]
  - canonical_id: cattle
    aliases: [cattle, cow, cows, bovine, bull, calf, ox, ow]
    # "ow" is a farm-animals-v1i dataset-specific artefact
  - canonical_id: horse
    aliases: [horse, horses, equine]
  - canonical_id: sheep
    aliases: [sheep, ovine, lamb]
  - canonical_id: goat
    aliases: [goat, goats, caprine]
  - canonical_id: pig
    aliases: [pig, pigs, swine, hog, pork]
  - canonical_id: rabbit
    aliases: [rabbit, rabbits, bunny, bunnies, domestic_rabbit]
  - canonical_id: chicken
    aliases: [chicken, chickens, hen, hens, rooster, roosters, poultry]
  - canonical_id: turkey
    aliases: [turkey, turkeys]
  - canonical_id: duck
    aliases: [duck, ducks, duckling, ducclair]
  - canonical_id: goose
    aliases: [goose, geese, gander]
  - canonical_id: donkey
    aliases: [donkey, donkeys, burro, jackass]
    # NOTE: "ass" intentionally omitted — too ambiguous in mixed-label contexts
  - canonical_id: peafowl
    aliases: [peafowl, peacock, peahen, peachick, indian_peafowl]
  - canonical_id: pigeon
    aliases: [pigeon, pigeons]
    # NOTE: "dove" / "doves" deliberately NOT included — taxonomically distinct.
    # Add a dataset_override below if a specific dataset mislabels doves as pigeons.
  - canonical_id: llama
    aliases: [llama, llamas]
  - canonical_id: alpaca
    aliases: [alpaca, alpacas]
  - canonical_id: dromedary
    aliases: [dromedary, dromedaries, arabian_camel, camelus_dromedarius,
              single_hump_camel]
  - canonical_id: bactrian_camel
    aliases: [bactrian, bactrian_camel, two_hump_camel, camelus_bactrianus]
  - canonical_id: camel
    aliases: [camel, camels, camelidae]
    note: Use dromedary or bactrian_camel when species is known.
  - canonical_id: water_buffalo
    aliases: [water_buffalo, water_buffaloes, buffalo, buffaloes, bubalus_bubalis]

