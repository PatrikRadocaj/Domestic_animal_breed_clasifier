name: yolo11_species
task: detect
base_model: yolo11s.pt
imgsz: 640
classes: species
data_yaml_path: data/processed/yolo_species.yaml

train:
  epochs: 100
  batch: 16
  workers: 8
  patience: 25
  optimizer: auto
  lr0: 0.01
  cos_lr: true
  close_mosaic: 10
  amp: true
  cache: false

export:
  formats:
    - onnx
  dynamic: true
  simplify: true

