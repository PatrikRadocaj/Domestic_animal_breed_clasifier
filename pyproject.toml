[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "animal-breed-detection"
version = "0.1.0"
description = "Research-grade two-stage and single-stage animal breed detection/classification pipelines."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Animal Breed Detection Project" }]
dependencies = [
  "albumentations>=2.0.8",
  "hydra-core>=1.3.2",
  "omegaconf>=2.3.0",
  "opencv-python>=4.10.0",
  "pandas>=2.2.0",
  "pillow>=10.4.0",
  "polars>=1.0.0",
  "pyarrow>=16.0.0",
  "pyyaml>=6.0.2",
  "rich>=13.7.0",
  "scikit-learn>=1.5.0",
  "timm>=1.0.27",
  "torch>=2.4.0",
  "torchmetrics>=1.7.0",
  "torchvision>=0.19.0",
  "tqdm>=4.66.0",
  "ultralytics>=8.4.48",
  "wandb>=0.27.0",
]

[project.optional-dependencies]
dev = [
  "ipykernel>=6.29.0",
  "pytest>=8.2.0",
  "ruff>=0.5.0",
]

[project.scripts]
animal-build-manifest = "animal_breed.data.manifests:main"
animal-validate-manifest = "animal_breed.data.manifest_schema:main"
animal-audit-dataset = "animal_breed.analysis.audit:main"
animal-split-manifest = "animal_breed.data.splitting:main"
animal-prepare-yolo = "animal_breed.detection.yolo_dataset:main"
animal-train-detector = "animal_breed.detection.train_yolo:main"
animal-train-classifier = "animal_breed.classification.train_classifier:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
