  oxford-iiit-pet-vgg:
    command: powershell -NoProfile -Command "$dst='{raw_dir}/oxford-iiit-pet-vgg';
      New-Item -ItemType Directory -Force -Path $dst | Out-Null; Invoke-WebRequest
      -Uri 'https://www.robots.ox.ac.uk/~vgg/data/pets/data/images.tar.gz' -OutFile
      ($dst + '/images.tar.gz'); Invoke-WebRequest -Uri 'https://www.robots.ox.ac.uk/~vgg/data/pets/data/annotations.tar.gz'
      -OutFile ($dst + '/annotations.tar.gz'); tar -xzf ($dst + '/images.tar.gz')
      -C $dst; tar -xzf ($dst + '/annotations.tar.gz') -C $dst"
  stanford-dogs-imagenetdogs:
    command: powershell -NoProfile -Command "$dst='{raw_dir}/stanford-dogs-imagenetdogs';
      New-Item -ItemType Directory -Force -Path $dst | Out-Null; Invoke-WebRequest
      -Uri 'http://vision.stanford.edu/aditya86/ImageNetDogs/images.tar' -OutFile
      ($dst + '/images.tar'); tar -xf ($dst + '/images.tar') -C $dst"
