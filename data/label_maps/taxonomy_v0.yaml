version: taxonomy_v1
description: >
  Domestic-animal hierarchy. Source of truth for species identifiers, breed
  identifiers, aliases and species-to-breed mapping.
  v1 changes vs v0: added 12 species that were missing (duck, goose, donkey,
  dromedary, peafowl, pigeon, turkey, llama, alpaca, camel, bactrian_camel,
  water_buffalo); expanded breed lists to match trained classifiers; fixed
  "friesian" alias collision between cattle and horse; cleaned up numeric/
  encoding artefacts.

unknown_policy:
  species_id: unknown_species
  breed_id:   unknown_breed
  allow_unknown_breed_for_training: false

